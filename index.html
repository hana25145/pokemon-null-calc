<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Null Damage Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: classic calc — move results on top, Pokémon 1 | Field | Pokémon 2, then Team/Box | Notes + Import | Opposing team + AI odds. Single dark look on purpose. */
:root{
  color-scheme:dark;
  --bg:#1d1d1d; --fg:#f1f1f1; --muted:#b4b4b4; --line:#8c8c8c; --line-soft:#5a5a5a;
  --btn:#2a2a2a; --btn-line:#c9c9c9; --sel:#29436e; --sel-line:#a9c1ec; --input:#141414;
  --hp:#2fae4b; --warn:#e6c43f; --bad:#ee5a43; --good:#4ccf6a; --ai:#f09a6c; --bar:#5d86c9;
  --f:Verdana, Tahoma, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono:Consolas, "Courier New", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:11px/1.35 var(--f);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.calc{max-width:880px;margin:0 auto}
h1.title{font-size:17px;font-weight:bold;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--fg)}
a{color:#8fb5ff}
input,select,textarea,button{font:inherit;color:var(--fg)}
input,select,textarea{background:var(--input);border:1px solid #9a9a9a;border-radius:2px;padding:1px 3px;min-width:0}
select{padding:0 1px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{width:100%;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sel-line);outline-offset:1px}
button{background:var(--btn);border:1px solid var(--btn-line);border-radius:6px;padding:2px 7px;cursor:pointer;line-height:1.3}
button:hover{background:#383838}
button.on{background:var(--sel);border-color:var(--sel-line)}
button:disabled{opacity:.45;cursor:default}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}
.err{color:var(--bad)}

/* top move results */
.results-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px;margin-bottom:10px}
.mr-head{font-size:10px;margin-bottom:3px}
.mr-head b{font-size:10px}
.mr-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:2px}
.mr-row button{width:100%;border-radius:3px;padding:2px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-text{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;min-width:0}
.aip{font-family:var(--mono);color:var(--ai);font-weight:bold;white-space:nowrap}
.aip.top{color:#111;background:var(--ai);border-radius:3px;padding:0 4px}
.ko1{color:var(--bad)} .ko2{color:var(--warn)}
.main-result{margin:4px 0 10px}
.main-line{font-weight:bold;font-size:12px;overflow-wrap:anywhere}
.amounts{font-size:9px;color:var(--warn);margin-top:3px;overflow-wrap:anywhere}
.amounts.crit{color:var(--muted)}

/* three columns */
.tri{display:grid;grid-template-columns:minmax(0,1fr) 252px minmax(0,1fr);gap:8px;align-items:start}
.tri.bottom{margin-top:6px}
@media (max-width:820px){.tri{grid-template-columns:minmax(0,1fr)}.results-top{grid-template-columns:minmax(0,1fr)}}
fieldset{border:1px solid var(--line);border-radius:4px;margin:0;padding:6px 8px 8px;min-width:0;position:relative}
legend{margin:0 auto;padding:0 6px;font-weight:bold;font-size:11px;text-align:center}
.stack{display:grid;gap:8px}

/* pokemon panel */
.picker{width:100%;margin-bottom:8px;padding:3px 6px;border-radius:3px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px;align-items:center;margin-bottom:2px}
.prow > span:first-child{white-space:nowrap}
.prow .ctl{display:flex;gap:3px;align-items:center;flex-wrap:wrap;min-width:0}
.prow select,.prow input{max-width:100%}
.w-type{width:64px}.w-forme{width:118px}.w-gender{width:62px}.w-lv{width:40px}
.w-wide{width:150px}
.stats{border-collapse:collapse;margin:6px 0 6px}
.stats th{font-weight:bold;text-align:right;padding:1px 4px 1px 0;white-space:nowrap}
.stats thead th{text-align:center;padding:0}
.stats td{padding:1px 2px}
.stats input{width:30px;text-align:left}
.stats .v{min-width:28px;font-family:var(--mono)}
.stats select{width:36px}
.spdicon{color:var(--warn);font-weight:bold;cursor:help;margin-left:4px;letter-spacing:-1px}
.saltbtn{margin:6px 0 8px;border-radius:7px;padding:3px 9px}
.hpline{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.hpline input{width:38px}
.healthlbl{margin-top:4px}
.hbar{height:4px;background:#3a3a3a;border-radius:2px;overflow:hidden;margin:2px 0 10px}
.hbar>i{display:block;height:100%;background:var(--hp)}
.mvrow{display:grid;grid-template-columns:minmax(0,1fr) 32px 52px 52px auto auto;gap:3px;align-items:center;margin-bottom:3px}
.mvrow input.mv{border-radius:3px;padding:1px 4px}
.mvrow input.bp{width:32px}
.mvrow select{width:52px}
.mvrow button{border-radius:5px;padding:0 4px;font-size:10px}
.mvchg{font-size:9px;color:var(--warn);margin:-2px 0 3px}
.edgetab{position:absolute;top:var(--t);width:26px;font-size:8px;padding:5px 0 3px;border-radius:4px;background:#3b3b3b;border:1px solid #777;text-align:center;line-height:1.1}
.edgetab::before{content:"⌄";display:block;font-size:11px;line-height:.7}
.edgetab.l{left:-34px}.edgetab.r{right:-34px}
.edgetab.off{opacity:.55}
@media (max-width:960px){.edgetab{position:static;display:inline-block;width:auto;padding:1px 6px;margin:0 3px 6px 0}.edgetab::before{display:none}}
.hidden-sec{display:none!important}

/* field panel */
.fgroup{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 0;margin:4px 0}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;padding:2px 5px;font-size:9.5px;white-space:nowrap}
.sides button,.spk button{white-space:nowrap}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button:only-child{border-radius:6px}
.fsep{border:0;border-top:2px solid var(--fg);margin:6px 0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.sides .col{display:grid;gap:3px;align-content:start}
.sides .col.l{justify-items:start}.sides .col.r{justify-items:end}
.sides button{font-size:9.5px;padding:1px 5px;border-radius:7px;min-width:62px}
.spk{display:inline-flex;align-items:center}
.spk button{min-width:0;border-radius:0;margin-left:-1px;padding:1px 4px}
.spk button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.spk button:last-child{border-radius:0 6px 6px 0}
.sides button.exp{border-radius:3px;min-width:0;margin-top:4px}

/* bottom */
.zone{min-height:40px;text-align:center;padding:2px 0 6px}
.zone h4{margin:0 0 4px;font-size:11px}
.zone + .zone{border-top:2px solid var(--fg);padding-top:6px}
.zone.drag{background:#262f3d}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:18px}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line-soft);border-radius:10px;padding:1px 3px 1px 7px;background:#262626;cursor:pointer;font-size:10px}
.chip.on{border-color:var(--sel-line);background:var(--sel)}
.chip.fainted{opacity:.45;text-decoration:line-through}
.chip .x{border:0;background:transparent;padding:0 4px;font-size:10px;color:var(--muted);border-radius:8px}
.chip.cc-g{box-shadow:inset 0 0 0 2px var(--good)}
.chip.cc-y{box-shadow:inset 0 0 0 2px var(--warn)}
.chip.cc-r{box-shadow:inset 0 0 0 2px var(--bad)}
.boxbtns{display:grid;gap:3px;justify-items:start;margin-top:6px}
.boxbtns button{border-radius:3px;font-size:10px}
.legend-cc{font-size:9px;color:var(--muted);margin-top:4px;text-align:left}
.notes textarea{min-height:88px}
.iotab{display:inline-block;border:1px solid var(--line);border-bottom:0;padding:1px 8px;font-size:10px;width:100%}
.io textarea{min-height:150px;font-family:var(--mono);font-size:10px;border-radius:0}
.iobtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.iobtns button{border-radius:3px;font-size:10px}
.oppbtns{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;margin-top:8px;border-top:2px solid var(--fg);padding-top:6px}
.oppbtns button{border-radius:3px;font-size:10px;background:#444}

/* sprites (names show instead wherever an image can't load) */
img.spr{display:block;width:48px;height:48px;object-fit:contain;flex:none}
legend img.spr.lg{display:inline-block;width:26px;height:26px;vertical-align:middle;margin:-8px 0 -8px 4px}
.typesec{position:relative}
img.spr.big{position:absolute;right:0;top:-4px;width:80px;height:80px;pointer-events:none}
img.spr.sm{display:inline-block;width:24px;height:24px;vertical-align:middle;margin:-6px 3px -6px 0}
.chip img.spr{margin:-2px 0}
.chip.has-spr{flex-direction:column;gap:0;padding:2px 4px;border-radius:6px;border-color:transparent;background:transparent;position:relative}
.chip.has-spr .nm{display:none}
.chip.has-spr.on{border-color:var(--sel-line);background:var(--sel)}
.chip.has-spr .x{position:absolute;top:-2px;right:-4px;padding:0 3px}
.chip.fainted img.spr{filter:grayscale(1)}
.chip.has-spr.cc-g,.chip.has-spr.cc-y,.chip.has-spr.cc-r{background:#262626}

/* AI odds */
.ai-sum{display:flex;flex-wrap:wrap;gap:3px 6px;margin-bottom:6px}
.tag{border:1px solid var(--line-soft);border-radius:8px;padding:0 6px;font-size:10px}
.tag.bad{color:var(--bad);border-color:currentColor}.tag.good{color:var(--good);border-color:currentColor}.tag.warn{color:var(--warn);border-color:currentColor}
.odds{display:grid;gap:5px}
.odd{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:2px 6px;align-items:center}
.odd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd .pc{font-family:var(--mono);text-align:right;font-weight:bold}
.odd .bar{grid-column:1/-1;height:6px;background:#333;border-radius:3px;overflow:hidden}
.odd .bar>i{display:block;height:100%;background:var(--bar)}
.odd.sw .bar>i{background:var(--ai)}
.odd .ds{grid-column:1/-1;font-size:9px;color:var(--muted)}
.subh{font-weight:bold;margin:8px 0 4px;padding-top:6px;border-top:1px solid var(--line-soft)}
details.st summary{cursor:pointer;font-weight:bold;margin-top:8px}
.togs{display:grid;grid-template-columns:1fr;gap:2px;margin-top:4px}
.togs label{display:flex;gap:4px;align-items:center}
.togs select,.togs input[type=number]{width:auto}
.note{font-size:9px;color:var(--muted);margin:6px 0 0}
</style>

<script>
(function(){

if (!window.calc || !window.calc.calculate) {
  app.innerHTML = '<div class="loading err">The damage engine could not load. Check the connection and reload. (계산 엔진을 불러오지 못했습니다.)</div>';
  return;
}
const C = window.calc;
const GEN = C.Generations.get(9);
const TRAINERS = JSON.parse(document.getElementById('trainer-data').textContent);
const MOVE_CHANGES = JSON.parse(document.getElementById('movechange-data').textContent);
const SPRITES = JSON.parse(document.getElementById('sprite-data').textContent);
/* ---------------- utils ---------------- */
const toID = s => ('' + (s || '')).toLowerCase().replace(/[^a-z0-9]+/g, '');
const esc = s => ('' + (s ?? '')).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = p => Math.random() < p;
const ST = ['hp','atk','def','spa','spd','spe'];
const ST_KO = {hp:'HP',atk:'공격',def:'방어',spa:'특공',spd:'특방',spe:'스피드'};
const BOOSTABLE = ['atk','def','spa','spd','spe'];
const STATUS_KO = {'':'없음',brn:'화상',par:'마비',psn:'독',tox:'맹독',slp:'잠듦',frz:'얼음',fbt:'동상'};
const TYPE_COLORS = {Normal:'#8a8a6a',Fire:'#e0612a',Water:'#3f7fe0',Electric:'#c9a400',Grass:'#4f9a3a',Ice:'#4aaeb8',Fighting:'#b8322a',Poison:'#8c3f9a',Ground:'#b8913a',Flying:'#7d84d8',Psychic:'#e04d7a',Bug:'#8a9a1a',Rock:'#9a8530',Ghost:'#61498f',Dragon:'#5a3be0',Dark:'#5a4a40',Steel:'#7d8a9a',Fairy:'#d0659a',Stellar:'#3f8f9a','???':'#68a090'};
const typeBadge = t => t ? `<span class="type" style="background:${TYPE_COLORS[t]||'#777'}">${esc(t)}</span>` : '';

const INDEX = {species:new Map(), moves:new Map(), items:new Map(), abilities:new Map()};
for (const s of GEN.species) INDEX.species.set(toID(s.name), s.name);
for (const m of GEN.moves) if (m.name && m.name !== '(No Move)') INDEX.moves.set(toID(m.name), m.name);
for (const i of GEN.items) INDEX.items.set(toID(i.name), i.name);
for (const a of GEN.abilities) INDEX.abilities.set(toID(a.name), a.name);
const NATURES = []; for (const n of GEN.natures) NATURES.push(n.name); NATURES.sort();

const SPECIES_ALIAS = {
  'Darmanitan-Zen-Mode-Galarian':'Darmanitan-Galar-Zen','Darmanitan-Zen-Mode':'Darmanitan-Zen',
  'Aegislash':'Aegislash-Shield','Zygarde-50-Power-Construct':'Zygarde','Xerneas-Active':'Xerneas',
  'Pikachu-Partner-Cap':'Pikachu','Oricorio-Pau':"Oricorio-Pa'u"
};
function resolveSpecies(n){
  if (!n) return null;
  let raw = SPECIES_ALIAS[n.trim()] || n.trim();
  let id = toID(raw); if (INDEX.species.has(id)) return INDEX.species.get(id);
  const t = raw.replace(/-Alolan\b/,'-Alola').replace(/-Galarian\b/,'-Galar').replace(/-Hisuian\b/,'-Hisui')
    .replace(/-Paldean\b/,'-Paldea').replace(/-Female$/,'-F').replace(/-Male$/,'');
  id = toID(t); if (INDEX.species.has(id)) return INDEX.species.get(id);
  const parts = t.split('-');
  while (parts.length > 1) { parts.pop(); id = toID(parts.join('-')); if (INDEX.species.has(id)) return INDEX.species.get(id); }
  return null;
}
const resolveMove = n => { if (!n) return null; if (/^hidden ?power/i.test(n)) return n.trim(); return INDEX.moves.get(toID(n)) || null; };
const resolveItem = n => (!n || toID(n) === 'none') ? '' : (INDEX.items.get(toID(n)) || '');
const resolveAbility = n => (!n || toID(n) === 'none') ? '' : (INDEX.abilities.get(toID(n)) || '');

/* ---------------- move lists from the Null AI document ---------------- */
const L = s => new Set(s.split(',').map(x => x.trim()).filter(Boolean));
const OFF_SETUP = L("Tidy Up,Dragon Dance,Shift Gear,Howl,Meditate,Sharpen,Swords Dance,Growth,Nasty Plot,Tail Glow,Hone Claws,Work Up,Power-Up Punch,Mystical Power,Torch Song");

const OFF_ATK = L("Tidy Up,Dragon Dance,Shift Gear,Howl,Meditate,Sharpen,Swords Dance,Growth,Hone Claws,Work Up,Power-Up Punch,Superpower,No Retreat,Victory Dance,Coil,Bulk Up,Curse");
const DEF_SETUP = L("Stuff Cheeks,Harden,Withdraw,Barrier,Acid Armor,Iron Defense,Cotton Guard,Shelter,Amnesia,Defense Curl,Stockpile,Cosmic Power,Psyshield Bash");
const DEF_ONLY = L("Stuff Cheeks,Harden,Withdraw,Barrier,Acid Armor,Iron Defense,Cotton Guard,Shelter,Defense Curl,Psyshield Bash");
const MIXED_PHYS = L("No Retreat,Victory Dance,Coil,Bulk Up,Curse");

/* ---------------- Pokemon construction ---------------- */
function megaFor(speciesName, itemName){
  if (!itemName) return null;
  const it = GEN.items.get(toID(itemName));
  if (!it || !it.megaStone) return null;
  const sp = GEN.species.get(toID(speciesName));
  const base = (sp && sp.baseSpecies) || speciesName;
  return it.megaStone[speciesName] || it.megaStone[base] || null;
}
function buildMon(set, opts){
  opts = opts || {};
  let sp = resolveSpecies(set.species);
  if (!sp) return null;
  const item = resolveItem(set.item);
  const mega = megaFor(sp, item); if (mega && INDEX.species.has(toID(mega))) sp = mega;
  if (opts.attacking && sp === 'Aegislash-Shield' && toID(set.ability) === 'stancechange') sp = 'Aegislash-Blade';
  const ability = resolveAbility(set.ability) || undefined;
  const status = set.status === 'fbt' ? '' : set.status;
  const ov = {};
  if (set.types && set.types[0]) ov.types = set.types.filter(Boolean);
  if (set.baseOv && Object.keys(set.baseOv).length) ov.baseStats = Object.assign({}, GEN.species.get(toID(sp)).baseStats, set.baseOv);
  let p;
  try {
    p = new C.Pokemon(GEN, sp, {level:+set.level||1, nature:set.nature||'Hardy', ability, item:item||undefined, gender:set.gender||undefined,
      ivs:set.ivs, boosts:set.boosts, status:status||'', abilityOn:true, overrides:Object.keys(ov).length ? ov : undefined});
  } catch(e){ return null; }
  const max = p.maxHP();
  const cur = set.curHP == null ? max : Math.max(0, Math.min(max, +set.curHP));
  p.originalCurHP = cur;
  p._set = set; p._frostbite = set.status === 'fbt'; p._sp = sp;
  return p;
}
const curHP = p => p.originalCurHP;

/* ---------------- Null move overrides ---------------- */
function hpTypeFromIVs(iv){
  const T = ['Fighting','Flying','Poison','Ground','Rock','Bug','Ghost','Steel','Fire','Water','Grass','Electric','Psychic','Ice','Dragon','Dark'];
  const b = ['hp','atk','def','spe','spa','spd'].reduce((a,s,i)=>a + ((iv[s]&1) << i), 0);
  return T[Math.floor(b*15/63)];
}
function isGrounded(p, field){
  if (field.isGravity) return true;
  if (p.hasType('Flying') || p.hasAbility('Levitate') || p.hasItem('Air Balloon')) return false;
  return true;
}
/* a move's numbers after Null changes, before field effects */
function nullMoveBase(name, set){
  let mvName = resolveMove(name);
  if (!mvName) return null;
  let display = mvName, bp, type, category;
  if (/^hidden ?power/i.test(mvName)) {
    const m = mvName.match(/hidden ?power\s+(\w+)/i);
    type = m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : hpTypeFromIVs(set.ivs);
    display = 'Hidden Power ' + type;
    mvName = GEN.moves.get('hiddenpower') ? 'Hidden Power' : 'Swift';
    bp = 60; category = 'Special';
  }
  const data = GEN.moves.get(toID(mvName));
  if (!data) return null;
  const ch = MOVE_CHANGES[display] || MOVE_CHANGES[mvName];
  if (bp == null) bp = (ch && ch.bp) || data.basePower;
  if (!type) type = (ch && ch.type) || data.type;
  if (!category) category = data.category;
  return {name:mvName, display, bp, type, category, data, changed:!!ch};
}
function makeMove(name, att, def, field, extra){
  extra = extra || {};
  const mo = extra.mo || {};
  const base = nullMoveBase(name, att._set);
  if (!base) return null;
  const ov = {basePower:base.bp, type:base.type, category:base.category};
  const userBp = mo.bp != null && mo.bp !== '';
  if (userBp) ov.basePower = +mo.bp;
  if (mo.type) ov.type = mo.type;
  if (mo.cat) ov.category = mo.cat;
  let bp = ov.basePower;
  if (EXPLOSION.has(base.name)) { bp = bp * 2; ov.basePower = bp; }   // Null: halves the target's (Sp.)Def
  // Null: Electric / Grassy / Psychic Terrain boost matching moves by 1.5x (calc applies 1.3x)
  const tMap = {Electric:'Electric', Grassy:'Grass', Psychic:'Psychic'};
  if (field && field.terrain && tMap[field.terrain] === ov.type && bp > 0 && isGrounded(att, field)) {
    ov.basePower = Math.round(bp * 1.5 * 4096 / 5325);
  }
  // leave variable-power moves (Weather Ball, Low Kick, ...) to the calc unless something changed their power
  if (!userBp && ov.basePower === base.data.basePower) delete ov.basePower;
  const opt = {ability:att.ability, item:att.item, species:att.name, isCrit:!!(extra.crit || mo.crit), overrides:ov};
  if (att.hasItem('Loaded Dice') && Array.isArray(base.data.multihit)) opt.hits = 4;
  let mv;
  try { mv = new C.Move(GEN, base.name, opt); } catch(e){ return null; }
  mv._display = base.display;
  return mv;
}
function fieldFor(attSide){
  const defSide = attSide === 'player' ? 'ai' : 'player';
  const sideObj = s => new C.Side({isSR:s.sr, spikes:s.spikes, isReflect:s.reflect, isLightScreen:s.lightScreen, isAuroraVeil:s.auroraVeil, isTailwind:s.tailwind,
    isProtected:s.protect, isSeeded:s.seeded, isForesight:s.foresight, isHelpingHand:s.helpingHand, isFlowerGift:s.flowerGift, isPowerTrick:s.powerTrick,
    isFriendGuard:s.friendGuard, isBattery:s.battery, isPowerSpot:s.powerSpot, isSwitching:s.switching ? 'out' : undefined, isSaltCured:s.saltCured});
  return new C.Field({gameType:S.field.gameType, weather:S.field.weather||undefined, terrain:S.field.terrain||undefined,
    isGravity:S.field.gravity, isMagicRoom:S.field.magicRoom, isWonderRoom:S.field.wonderRoom,
    attackerSide:sideObj(S.sides[attSide]), defenderSide:sideObj(S.sides[defSide])});
}
function rollsOf(res){
  const d = res.damage;
  if (typeof d === 'number') return Array(16).fill(d);
  if (Array.isArray(d[0])) return d[0].map((_, i) => d.reduce((s, a) => s + a[i], 0));
  return d.slice();
}
function cannotCrit(def){ return def.hasAbility('Battle Armor','Shell Armor','Leaf Guard','Magma Armor'); }

/* ---------------- speed ---------------- */
const stageMult = s => s >= 0 ? (2 + s) / 2 : 2 / (2 - s);
function speedOf(p, sideKey){
  let s = Math.floor(p.rawStats.spe * stageMult(p.boosts.spe || 0));
  const w = S.field.weather, t = S.field.terrain;
  if (p.hasItem('Choice Scarf')) s = Math.floor(s * 1.5);
  if (p.hasItem('Iron Ball')) s = Math.floor(s * .5);
  if ((p.hasAbility('Swift Swim') && w === 'Rain') || (p.hasAbility('Chlorophyll') && w === 'Sun') ||
      (p.hasAbility('Sand Rush') && w === 'Sand') || (p.hasAbility('Slush Rush') && w === 'Snow') ||
      (p.hasAbility('Surge Surfer') && t === 'Electric')) s *= 2;
  if (p.hasAbility('Quick Feet') && p.status) s = Math.floor(s * 1.5);
  if (p.hasAbility('Unburden') && (sideKey === 'ai' ? S.b.aiUnburden : S.b.plUnburden)) s *= 2;
  if (p.hasAbility('Slow Start')) s = Math.floor(s * .5);
  if (S.sides[sideKey].tailwind) s *= 2;
  if (p.status === 'par' && !p.hasAbility('Quick Feet')) s = Math.floor(s * .25);  // Null: -75%
  return s;
}
function aiIsFaster(aiSpe, plSpe){
  if (S.b.speedOverride === 'ai') return true;
  if (S.b.speedOverride === 'pl') return false;
  return S.field.trickRoom ? aiSpe <= plSpe : aiSpe >= plSpe;   // AI sees speed ties as faster
}

/* ---------------- damage evaluation ---------------- */
function usability(att, def, mv, who){
  // Damage Move Usability Checks from the Null AI document. Returns 0 (unusable), 1 (usable) or a probability.
  const n = mv.name, disp = mv._display;
  const moldBreaker = att.hasAbility('Mold Breaker','Teravolt','Turboblaze');
  const ab = moldBreaker ? '' : def.ability;
  const has = (...a) => a.includes(ab);
  if (mv.type === 'Electric' && has('Volt Absorb','Motor Drive','Lightning Rod')) return 0;
  if (mv.type === 'Water' && has('Water Absorb','Dry Skin','Storm Drain')) return 0;
  if (mv.type === 'Fire' && has('Flash Fire','Well-Baked Body')) return 0;
  if (mv.type === 'Grass' && has('Sap Sipper')) return 0;
  if (mv.type === 'Ground' && has('Earth Eater')) return 0;
  if (mv.flags && mv.flags.sound && has('Soundproof')) return 0;
  if (mv.flags && mv.flags.bullet && has('Bulletproof')) return 0;
  if (WIND.has(n) && has('Wind Rider')) return 0;
  if ((mv.priority || 0) > 0 && has('Dazzling','Armor Tail','Queenly Majesty')) return 0;
  if (n === 'Dream Eater' && (def.status !== 'slp' || def.hasAbility('Comatose'))) return 0;
  if (n === 'Poltergeist' && !def.item) return 0;
  if (n === 'Burn Up' && !att.hasType('Fire')) return 0;
  if (n === 'Steel Roller' && !S.field.terrain) return 0;
  if (who === 'ai') {
    if (n === 'Fake Out' && !S.b.aiFirstTurn) return 0;
    if (n === 'First Impression' && !S.b.aiFirstTurn) return 0;
    if (n === 'Future Sight' && S.b.futureSightOnPl) return 0;
    if (n === 'Gigaton Hammer' && S.b.aiLastMove === 'Gigaton Hammer') return 0;
    if (n === 'Belch' && !S.b.aiBerryEaten) return 0;
    if ((n === 'Meteor Beam' || n === 'Sky Attack' || n === 'Freeze Shock' || n === 'Ice Burn') && !att.hasItem('Power Herb')) return 0;
    if (n === 'Electro Shot' && !att.hasItem('Power Herb') && S.field.weather !== 'Rain') return 0;
    if ((n === 'Sucker Punch' || n === 'Thunderclap') && S.b.aiLastMove === n) return 1/3;
    if (S.b.aiTaunted && mv.category === 'Status') return 0;
  }
  return 1;
}
function evalMove(att, def, name, field, who, mo, slot){
  const mv = makeMove(name, att, def, field, {mo});
  if (!mv) return {name, invalid:true};
  const o = {name:mv.name, display:mv._display, mv, cat:mv.category, type:mv.type, prio:mv.priority||0, bp:mv.bp,
             rolls:Array(16).fill(0), crit:null, res:null, status:mv.category === 'Status'};
  o.usable = usability(att, def, mv, who); o.slot = slot;
  if (!o.status) {
    try {
      const res = C.calculate(GEN, att, def, mv, field);
      o.res = res; o.rolls = rollsOf(res);
      if (!cannotCrit(def)) {
        const mc = makeMove(name, att, def, field, {crit:true, mo});
        if (mc) o.crit = rollsOf(C.calculate(GEN, att, def, mc, field));
      }
    } catch(e){ o.err = String(e.message || e); }
    if (o.rolls.every(x => x === 0)) o.zero = true;
  }
  o.max = Math.max(...o.rolls); o.min = Math.min(...o.rolls);
  return o;
}
const sashLike = (p, who) => curHP(p) === p.maxHP() && (p.hasItem('Focus Sash') || p.hasAbility('Sturdy') ||
  (who === 'ai' && p.hasAbility('Disguise') && S.b.aiDisguise));
function hitsToKill(hp, dmg, sash){ if (dmg <= 0) return Infinity; let n = Math.ceil(hp / dmg); if (n === 1 && sash) n = 2; return n; }

/* ---------------- AI scoring (Null AI document) ---------------- */
function prepareContext(ai, pl){
  const aiF = fieldFor('ai'), plF = fieldFor('player');
  const aiAtt = buildMon(ai._set, {attacking:true}) || ai;
  const aiMoves = ai._set.moves.map((n, i) => n ? evalMove(aiAtt, pl, n, aiF, 'ai', ai._set.mo[i], i) : null).filter(m => m && !m.invalid);
  const plAtt = buildMon(pl._set, {attacking:true}) || pl;
  const plMoves = pl._set.moves.map((n, i) => n ? evalMove(plAtt, ai, n, plF, 'player', pl._set.mo[i], i) : null).filter(m => m && !m.invalid);
  const aiSpe = speedOf(ai, 'ai'), plSpe = speedOf(pl, 'player');
  const aiFaster = aiIsFaster(aiSpe, plSpe);
  const plHP = curHP(pl), aiHP = curHP(ai);
  const plDmgMoves = plMoves.filter(m => !m.status);
  const has = (list, set) => list.some(m => set.has(m.name));
  const plNames = new Set(plMoves.map(m => m.name));
  const aiNames = new Set(aiMoves.map(m => m.name));
  const team = S.ai.team;
  const alive = team.filter(t => !t.fainted).length;
  const ctx = {
    ai, pl, aiMoves, plMoves, aiSpe, plSpe, aiFaster, plHP, aiHP, aiMax:ai.maxHP(), plMax:pl.maxHP(),
    aiHPpct:aiHP / ai.maxHP() * 100, plHPpct:plHP / pl.maxHP() * 100,
    plPhys:plDmgMoves.some(m => m.cat === 'Physical'), plSpec:plDmgMoves.some(m => m.cat === 'Special'),
    plHasStatus:plMoves.some(m => m.status), plHasDamaging:plDmgMoves.length > 0,
    plHazeLike:pl.hasAbility('Unaware') || has(plMoves, HAZE_LIKE), plPhaze:has(plMoves, PHAZE),
    plSound:plMoves.some(m => m.mv.flags && m.mv.flags.sound), plInfiltrator:pl.hasAbility('Infiltrator'),
    plPriority:plMoves.some(m => m.prio > 0 && !m.status),
    plIncap:(pl.status === 'slp' && !plNames.has('Sleep Talk') && !plNames.has('Snore') && !pl.hasAbility('Comatose')) || pl.status === 'frz' || S.b.plRecharging,
    aiNames, plNames, alive, total:team.length || 1, aiLastMon:alive <= 1, plLastMon:S.b.plLastMon,
    aiSash:sashLike(ai, 'ai'), plSash:sashLike(pl, 'player'),
    support:isSupport(ai._set),
  };
  ctx.plFoulConf = plMoves.some(m => m.name === 'Foul Play' || CONFUSE.has(m.name));
  ctx.plBJ = plMoves.some(m => m.name === 'Burning Jealousy' || m.name === 'Alluring Voice');
  ctx.aiMaxKill = aiMoves.some(m => !m.status && m.usable > 0 && !NEVER_HDM.has(m.name) && m.max >= plHP && !(ctx.plSash && (m.mv.hits || 1) === 1));
  // player's last used move damage (for Disable)
  const last = plMoves.find(m => m.name === resolveMove(S.b.plLastMove));
  ctx.plLastMoveObj = last || null;
  return ctx;
}
function isSupport(set){
  if (toID(set.ability) === 'imposter') return false;
  let dmgCount = 0;
  for (const n of set.moves) {
    const mn = resolveMove(n); if (!mn) continue;
    const d = GEN.moves.get(toID(mn)); if (!d) continue;
    if (d.category === 'Status') continue;
    const bp = (MOVE_CHANGES[mn] && MOVE_CHANGES[mn].bp) || d.basePower;
    if (bp > 75) return false;
    if (SUPPORT_UTILITY.has(mn)) continue;
    dmgCount++;
  }
  return dmgCount <= 1;
}
function statusImmune(kind, t, ctx, moveName){
  const p = ctx.pl;

  if (bad(ai.status) || b.aiCursed || b.aiSeeded || b.aiYawn || b.aiPerishFaint) s -= 1;
  if (bad(pl.status) || pl._frostbite || b.plCursed || b.plSeeded || b.plYawn || b.plPerish) s += 1;
  if (ai.hasAbility('Speed Boost') && !ctx.aiFaster && b.aiFirstTurn) { if (R(.8)) s += 3; }
  else if (b.aiFirstTurn) {
    const orb = (ai.hasItem('Toxic Orb','Flame Orb') && ai.hasAbility('Guts','Quick Feet')) || (ai.hasItem('Flame Orb') && ai.hasAbility('Flare Boost'));
    if (!orb) s -= 1;

}
/* routine for damaging moves that carry an AI routine (used when the move is not the HDM) */
function damagingRoutine(m, ctx, dmg, kills){
  const n = m.name, ai = ctx.ai, pl = ctx.pl, b = S.b;
  if (BINDING.has(n)) { if (pl.hasType('Ghost') || b.plWrapped) return 0; let s = R(.8) ? 6 : 8; if (ai.hasItem('Binding Band','Grip Claw')) s += 1; return s; }
  if (n === 'Salt Cure') { let s = R(.8) ? 6 : 7; if (pl.hasType('Water','Steel')) s += 1; return s; }
  if (TRAPPING.has(n)) return (pl.hasType('Ghost') || b.plTrapped) ? 0 : 6;
  if (n === 'Rollout' || n === 'Ice Ball') return (R(.5) ? 6 : 7) + (b.aiDefCurled ? 1 : 0);
  if (n === 'Fury Cutter' || n === 'Echoed Voice') return 6 + (b.aiLastMove === n ? 2 : 0);
  if (PIVOT.has(n)) { let s = 0; if (ctx.aiHits > 3) s += 6; if (ctx.plPhaze) s -= 1; return s; }
  if (n === 'Knock Off') return (ctx.aiHits > 3 && pl.item && !pl.hasAbility('Sticky Hold')) ? 6 : 0;
  if (DRAIN.has(n)) { let s = 0; if (!pl.hasAbility('Liquid Ooze') && ctx.aiHPpct <= 50 && hitsToKill(ctx.plHP, dmg, ctx.plSash) <= 4) { s += 6; if (ai.hasItem('Big Root')) s += 1; } return s; }
  if (n === 'Fell Stinger') return kills ? (ctx.aiFaster ? 9 : 6) : 0;
  if (n === 'Secret Power') return (S.field.terrain === 'Grassy' && R(.25)) ? 6 : 0;
  if (GUAR.has(n)) {
    if (n === 'Nuzzle' || n === 'Mortal Spin' || BURN.has(n)) {
      const kind = n === 'Nuzzle' ? 'par' : (n === 'Mortal Spin' ? 'psn' : (n === 'Freezy Frost' ? 'fbt' : 'brn'));
      if (statusImmune(kind, null, ctx, n)) return 0;
    }
    if (n === 'Stone Axe' && S.sides.player.sr) return 0;
    if (n === 'Ceaseless Edge' && S.sides.player.spikes >= 3) return 0;
    const d = statusRoutine(m, ctx);
    return d <= -10 ? 0 : 6 + d;
  }
  return 0;
}

function scoreAll(ctx){
  const {aiMoves} = ctx;
  const scores = [];
  // pick a random damage roll for every move, both sides
  const dmg = aiMoves.map(m => {
    if (m.status) return 0;
    if (m.usable < 1 && !(m.usable > 0 && R(m.usable))) return 0;
    return m.rolls[(Math.random() * 16) | 0];
  });
  const usableFlags = aiMoves.map((m, i) => m.status ? !(m.usable === 0) : dmg[i] > 0 || m.usable === 1);
  let plBest = 0; ctx.plRollIdx = (Math.random() * 16) | 0;
  for (const pm of ctx.plMoves) { if (pm.status || pm.usable === 0) continue; const d = pm.rolls[(Math.random() * 16) | 0]; if (d > plBest) plBest = d; }
  ctx.plBest = plBest;
  ctx.plHits = hitsToKill(ctx.aiHP, plBest, ctx.aiSash);
  ctx.plKillsAI = ctx.plHits === 1;
  const kills = aiMoves.map((m, i) => !m.status && dmg[i] >= ctx.plHP && !(ctx.plSash && (m.mv.hits || 1) === 1) && dmg[i] > 0);
  let hdm = 0;
  aiMoves.forEach((m, i) => { if (!m.status && !NEVER_HDM.has(m.name)) hdm = Math.max(hdm, Math.min(dmg[i], ctx.plHP)); });
  const best = aiMoves.reduce((a, m, i) => (!m.status && !NEVER_HDM.has(m.name)) ? Math.max(a, dmg[i]) : a, 0);
  ctx.aiHits = hitsToKill(ctx.plHP, best, ctx.plSash);
  const choice = ctx.ai.hasItem('Choice Band','Choice Specs','Choice Scarf');
  aiMoves.forEach((m, i) => {
    const n = m.name;
    let s = 0;
    if (m.status) {
      if (!usableFlags[i]) { scores.push(-20); return; }
      s = (n === 'Nature Power' || n === 'Memento') ? 0 : 6;
      if (n === 'Future Sight') s = 6;
      s += statusRoutine(m, ctx);
      if (choice && !CHOICE_OK.has(n)) s -= 20;
      scores.push(s); return;
    }
    // damaging moves
    if (dmg[i] === 0 && !['Counter','Mirror Coat','Metal Burst','Final Gambit','Explosion','Self-Destruct','Misty Explosion'].includes(n)) {
      scores.push(m.usable === 0 || (m.usable < 1) ? -20 : 0); return;
    }
    const isHDM = !NEVER_HDM.has(n) && dmg[i] > 0 && Math.min(dmg[i], ctx.plHP) === hdm;
    const hdmScore = R(.25) ? 8 : 6;
    if (EXPLOSION.has(n)) s = explosionScore(ctx, false);
    else if (n === 'Final Gambit') {
      s = (ctx.aiFaster && ctx.aiHP >= ctx.plHP) ? 8 : (ctx.aiFaster && ctx.plKillsAI) ? 7 : 6;
      if (ctx.aiLastMon) s += ctx.plLastMon ? -1 : -10;
    }
    else if (OHKO.has(n)) {
      if (ctx.plSash || ctx.pl.level > ctx.ai.level) s = -20;
      else s = ctx.aiHits >= 3 ? 6 : 5;
    }
    else if (n === 'Meteor Beam' || n === 'Electro Shot') s = (R(.8) ? 9 : 9);
    else if (n === 'Future Sight') s = 6;
    else if (n === 'Feint') s = (kills[i] && R(.1)) ? 6 : 0;
    else if (n === 'Upper Hand') s = (ctx.plPriority && R(.1)) ? 13 : 0;
    else if (['Counter','Mirror Coat','Metal Burst'].includes(n)) s = 6 + statusRoutine(m, ctx);
    else if (isHDM) s = hdmScore;
    else if (GUAR.has(n)) s = damagingRoutine(m, ctx, dmg[i], kills[i]);
    // kill bonus
    if (kills[i] && !NO_KILL_BONUS.has(n) && (!NEVER_HDM.has(n) || ['Meteor Beam','Electro Shot','Future Sight'].includes(n))) {
      s += (ctx.aiFaster || m.prio > 0) ? 6 : 3;
      if (ctx.ai.hasAbility('Moxie','Beast Boost','Chilling Neigh','Grim Neigh','As One (Glastrier)','As One (Spectrier)')) s += 1;
    }
    // damaging priority moves
    if (m.prio > 0 && n !== 'Feint' && !ctx.aiFaster) {
      if (ctx.plKillsAI) s += isHDM ? 5 : 11;
      else if (ctx.ai.hasItem('Eject Button')) s += 11;
    }
    if ((ctx.ai.status === 'frz' || ctx.ai._frostbite) && THAW.has(n)) s += 12;
    if (n === 'Fake Out') {
      s += 9;
      if ((ctx.pl.hasAbility('Inner Focus','Shield Dust') || ctx.pl.hasItem('Covert Cloak') || S.b.plSub) && !kills[i]) s -= 30;
    }
    if (n === 'Pursuit') {
      let p;
      if (ctx.ai.hasAbility('Truant','Defeatist') && ctx.pl.hasAbility('Mummy','Wandering Spirit','Lingering Aroma')) p = 12;
      else { p = kills[i] ? 11 : ctx.plHPpct < 20 ? 10 : (ctx.plHPpct < 40 && R(.5)) ? 8 : 0; if (ctx.aiFaster) p += 3; }
      s = Math.max(s, p);
    }
    if ((n === 'Sucker Punch' || n === 'Thunderclap') && S.b.aiLastMove === n && R(.66)) s -= 20;
    if (RECHARGE.has(n) && !kills[i]) s -= 1;
    if ((n === 'Dragon Tail' || n === 'Circle Throw') && (S.b.plPerish || ctx.plKillsAI)) s -= 20;
    if (PIVOT.has(n) && ctx.ai._sp && ctx.ai._sp.startsWith('Palafin') && !ctx.ai._sp.includes('Hero')) s = 12;
    if (n === 'Relic Song') { if (ctx.ai._sp === 'Meloetta') s += 10; else if (ctx.ai._sp === 'Meloetta-Pirouette' && R(.25)) s += 1; }
    scores.push(s);
  });
  return {scores, dmg, kills};
}

/* ---------------- switching ---------------- */
function switchInScores(ctx, candidates){
  // returns per-candidate scores using random rolls (one sample)
  return candidates.map(c => {
    if (c.special != null) return c.special;
    const cd = Math.max(0, ...c.aiMoves.filter(m => !m.status && !NEVER_HDM.has(m.name) && m.usable > 0).map(m => m.rolls[(Math.random() * 16) | 0]));
    const pd = Math.max(0, ...c.plMoves.filter(m => !m.status && m.usable > 0).map(m => m.rolls[(Math.random() * 16) | 0]));
    const cHits = hitsToKill(ctx.plHP, cd, ctx.plSash);
    const pHits = hitsToKill(c.hp, pd, c.sash);
    let s;
    if (c.faster && cHits === 1) s = 5;
    else if (!c.faster && cHits === 1) s = 4;
    else if (c.faster && cHits <= pHits && cHits < Infinity) s = 3;
    else if (!c.faster && cHits < pHits) s = 2;
    else if (c.faster) s = 1;
    else if (pHits === 1) s = -1;
    else s = 0;
    if (c.support && s !== -1 && R(.1)) s += 2;
    return s;
  });
}
function hazardDamage(p){
  const sd = S.sides.ai; let d = 0;
  if (p.hasItem('Heavy-Duty Boots') || p.hasAbility('Magic Guard')) return 0;
  if (sd.sr) { let eff = 1; for (const t of p.types) eff *= (GEN.types.get(toID('Rock')).effectiveness[t] ?? 1); d += Math.floor(p.maxHP() * eff / 8); }
  if (sd.spikes && isGrounded(p, {isGravity:S.field.gravity})) d += Math.floor(p.maxHP() * [0, 1/8, 1/6, 1/4][sd.spikes]);
  return d;
}
function buildCandidates(ctx){
  const out = [];
  S.ai.team.forEach((set, idx) => {
    if (idx === S.ai.active || set.fainted) return;
    const c = buildMon(set); if (!c) return;
    const att = buildMon(set, {attacking:true}) || c;
    const aiF = fieldFor('ai'), plF = fieldFor('player');
    const plAtt = buildMon(ctx.pl._set, {attacking:true}) || ctx.pl;
    const cand = {idx, set, mon:c,
      aiMoves:set.moves.map((n, i) => n ? evalMove(att, ctx.pl, n, aiF, 'ai', set.mo[i], i) : null).filter(m => m && !m.invalid),
      plMoves:ctx.pl._set.moves.map((n, i) => n ? evalMove(plAtt, c, n, plF, 'player', ctx.pl._set.mo[i], i) : null).filter(m => m && !m.invalid),
      support:isSupport(set)};
    cand.hp = Math.max(1, curHP(c) - hazardDamage(c));
    cand.sash = cand.hp === c.maxHP() && (c.hasItem('Focus Sash') || c.hasAbility('Sturdy'));
    const spe = speedOf(c, 'ai');
    cand.spe = spe;
    cand.faster = aiIsFaster(spe, ctx.plSpe);
    const sp = c._sp || '';
    if (sp === 'Palafin') cand.special = 4;
    else if (c.hasAbility('Imposter')) cand.special = 3;
    else if (sp === 'Wynaut' || sp === 'Wobbuffet') cand.special = 2;
    out.push(cand);
  });
  return out;
}
function midTurnSwitch(ctx, candidates){
  // returns {p, reason, anyNeg}
  const b = S.b, ai = ctx.ai;
  if (!candidates.length) return {p:0, reason:'교체할 포켓몬 없음'};
  const avoid = BOOSTABLE.some(st => stageOf(ai, st) > 0) || ctx.aiMaxKill || ctx.plMoves.some(m => m.name === 'Pursuit' || PHAZE.has(m.name) || OHKO.has(m.name));
  const turnsIn = b.aiTurns;
  const bestDmgMax = Math.max(0, ...ctx.aiMoves.filter(m => !m.status && m.usable > 0).map(m => m.max));
  const healing = ctx.pl.hasItem('Leftovers','Black Sludge') || b.aiSeeded || ctx.pl.hasAbility('Poison Heal');
  const walled = bestDmgMax <= ctx.plMax * (healing ? .2 : .1);
  const weatherAb = {Drought:'Sun',Drizzle:'Rain','Sand Stream':'Sand','Snow Warning':'Snow','Orichalcum Pulse':'Sun'};
  const terrainAb = {'Electric Surge':'Electric','Grassy Surge':'Grassy','Misty Surge':'Misty','Psychic Surge':'Psychic','Hadron Engine':'Electric'};
  const immune = {'Water Absorb':'Water','Storm Drain':'Water','Dry Skin':'Water','Volt Absorb':'Electric','Motor Drive':'Electric','Lightning Rod':'Electric','Flash Fire':'Fire','Well-Baked Body':'Fire','Sap Sipper':'Grass','Levitate':'Ground','Earth Eater':'Ground','Wind Rider':'Flying'};
  const lastPl = resolveMove(b.plLastMove); const lastType = lastPl ? (MOVE_CHANGES[lastPl]?.type || GEN.moves.get(toID(lastPl))?.type) : null;
  const conds = [
    [b.aiPerishFaint, 1, '멸망의노래로 쓰러지기 직전', true],
    [ctx.ai._sp === 'Palafin' && !ctx.aiFaster && ctx.plOHKOmax, 1, '팔라피 제로폼이 느리고 확정 1타', true],
    [turnsIn > 25, .4, '25턴 넘게 필드에 있음 (Anti-Setup Plus)', true, true],
    [turnsIn > 1 && ctx.allUseless, .4, '모든 기술이 무의미 (Anti-Setup)', true],
    [walled && turnsIn > 5 && !avoid, .2, '의미 있는 데미지를 못 줌 (Walled)'],
    [ctx.support && turnsIn > 1 && !avoid, .2, '서포트형 (Support)'],
    [((weatherAb[ai.ability] && S.field.weather !== weatherAb[ai.ability]) || (terrainAb[ai.ability] && S.field.terrain !== terrainAb[ai.ability])) && turnsIn > 1 && !avoid, .2, '날씨/필드가 끝남 (Weather)'],
    [turnsIn > 12 && !avoid, .2, '12턴 넘게 필드에 있음 (Anti-Stall)'],
    [ai.hasAbility('Regenerator') && ctx.aiHP < ctx.aiMax * 2 / 3 && !avoid, .4, '재생력 + HP 2/3 미만 (Regenerator)'],
    [lastType && immune[ai.ability] === lastType, .75, '상대가 직전에 쓴 기술을 특성으로 무효화 (Immunity)'],
  ];
  for (const [ok, p, reason, , anyNeg] of conds) if (ok) return {p, reason, anyNeg:!!anyNeg, avoid};
  return {p:0, reason:avoid ? '교체 회피 조건 활성 (능력 상승/킬 가능/상대 강제교체기)' : '교체 조건 해당 없음', avoid};
}

function simulate(){
  const aiSet = S.ai.team[S.ai.active], plSet = S.player.box[S.player.active];
  if (!aiSet || !plSet) return null;
  S.b.plSeeded = S.sides.player.seeded; S.b.aiSeeded = S.sides.ai.seeded;
  const ai = buildMon(aiSet), pl = buildMon(plSet);
  if (!ai || !pl) return {error:!ai ? 'AI 포켓몬 이름을 찾을 수 없습니다: ' + aiSet.species : '내 포켓몬 이름을 찾을 수 없습니다: ' + plSet.species};
  S.ai.team.forEach(t => { const m = buildMon(t); t._hpPct = m ? curHP(m) / m.maxHP() * 100 : 100; });
  const ctx = prepareContext(ai, pl);
  ctx.plOHKOmax = ctx.plMoves.some(m => !m.status && m.max >= ctx.aiHP);
  const N = S.sims, k = ctx.aiMoves.length;
  const tally = new Array(k).fill(0), hdmCount = new Array(k).fill(0), killCount = new Array(k).fill(0);
  const hist = ctx.aiMoves.map(() => new Map());
  let uselessAll = 0;
  for (let it = 0; it < N; it++) {
    const {scores, dmg, kills} = scoreAll(ctx);
    if (scores.every((s, i) => (ctx.aiMoves[i].status ? s <= -10 : dmg[i] === 0))) uselessAll++;
    let best = -Infinity; scores.forEach(s => { if (s > best) best = s; });
    const tied = []; scores.forEach((s, i) => { if (s === best) tied.push(i); });
    tied.forEach(i => tally[i] += 1 / tied.length);
    scores.forEach((s, i) => { hist[i].set(s, (hist[i].get(s) || 0) + 1); if (kills[i]) killCount[i]++; });
  }
  ctx.allUseless = uselessAll / N > .5;
  // switching
  const cands = buildCandidates(ctx);
  const sw = midTurnSwitch(ctx, cands);
  let swTo = new Map(), swValid = 0, postKO = new Map(), postScores = cands.map(() => new Map());
  for (let it = 0; it < 2000 && cands.length; it++) {
    const sc = switchInScores(ctx, cands);
    // post-KO: highest score, ties -> party order
    let bi = 0; sc.forEach((s, i) => { if (s > sc[bi]) bi = i; });
    postKO.set(bi, (postKO.get(bi) || 0) + 1);
    sc.forEach((s, i) => postScores[i].set(s, (postScores[i].get(s) || 0) + 1));
    // mid-turn: needs a non-negative candidate unless Anti-Setup Plus
    const best = Math.max(...sc);
    if (best >= 0 || sw.anyNeg) {
      swValid++;
      const tied = sc.map((s, i) => s === best ? i : -1).filter(i => i >= 0);
      const pick = sw.anyNeg || /Anti-Setup/.test(sw.reason) ? tied[(Math.random() * tied.length) | 0] : tied[0];
      swTo.set(pick, (swTo.get(pick) || 0) + 1);
    }
  }
  const iters = cands.length ? 2000 : 1;
  const pSwitch = sw.p * (swValid / iters);
  return {ai, pl, ctx, tally:tally.map(t => t / N * (1 - pSwitch)), hist, killCount, N, cands, sw, pSwitch, swTo, swValid, postKO, postScores, iters};
}

/* ---------------- Showdown import ---------------- */
function parseShowdown(text){
  const out = [];
  for (const block of text.replace(/\r/g,'').split(/\n\s*\n/)) {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const set = makeSet({moves:[]});
    let first = lines[0];
    const at = first.split(' @ ');
    if (at[1]) set.item = at[1].trim();
    let nm = at[0].replace(/\((M|F)\)/g, '').trim();
    const paren = nm.match(/\(([^)]+)\)\s*$/);
    set.species = paren ? paren[1].trim() : nm;
    for (const l of lines.slice(1)) {
      let m;
      if ((m = l.match(/^Ability:\s*(.+)/i))) set.ability = m[1];
      else if ((m = l.match(/^Level:\s*(\d+)/i))) set.level = +m[1];
      else if ((m = l.match(/^(\w+) Nature/i))) set.nature = m[1];
      else if ((m = l.match(/^IVs:\s*(.+)/i))) {
        for (const part of m[1].split('/')) { const mm = part.trim().match(/(\d+)\s*(HP|Atk|Def|SpA|SpD|Spe)/i); if (mm) set.ivs[{hp:'hp',atk:'atk',def:'def',spa:'spa',spd:'spd',spe:'spe'}[mm[2].toLowerCase()]] = +mm[1]; }
      }
      else if ((m = l.match(/^[-~]\s*(.+)/))) set.moves.push(m[1].replace(/\[(\w+)\]/, '$1').trim());
    }
    while (set.moves.length < 4) set.moves.push('');
    set.moves = set.moves.slice(0, 4);
    if (resolveSpecies(set.species)) out.push(set);
  }
  return out;
}

/* ---------- Pokémon panel ---------- */
function pokePanel(side){
  const set = sideSet(side);
  const title = side === 'player' ? 'Pokémon 1' : 'Pokémon 2';
  const hid = UI.hide[side];
  const tabs = ['Type','Stats','HP','Moves'].map((t, i) => `<button class="edgetab ${side === 'player' ? 'l' : 'r'} ${hid[t] ? 'off' : ''}" style="--t:${[40, 120, 330, 390][i]}px" data-act="tab" data-side="${side}" data-k="${t}" aria-pressed="${!hid[t]}">${t}</button>`).join('');
  if (!set) return `<fieldset><legend>${title}</legend>${tabs}<p class="muted">No Pokémon.</p></fieldset>`;
  const p = buildMon(set);
  const id = f => `${side}-${f}`;
  const picker = side === 'player'
    ? `<input class="picker" id="${id('pick')}" list="dl-plsets" value="${esc(plLabel(set, S.player.active))}" data-side="${side}" data-f="pick" autocomplete="off" aria-label="Pokémon 1 set">`
    : `<input class="picker" id="${id('pick')}" list="dl-aisets" value="${esc(aiLabel())}" data-side="${side}" data-f="pick" autocomplete="off" aria-label="Pokémon 2 set">`;
  if (!p) return `<fieldset><legend>${title}</legend>${tabs}${picker}<p class="err">Unknown Pokémon “${esc(set.species)}”. Pick one from the list.</p></fieldset>`;
  const typeSel = (i) => `<select class="w-type" id="${id('type' + i)}" data-side="${side}" data-f="type" data-k="${i}">${i ? '<option value="">(none)</option>' : ''}${TYPES.map(t => `<option ${p.types[i] === t ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const spData = GEN.species.get(toID(p._sp));
  const baseName = spData.baseSpecies || spData.name;
  const formes = [baseName, ...((GEN.species.get(toID(baseName)) || {}).otherFormes || [])];
  if (!formes.includes(p._sp)) formes.push(p._sp);
  const formeSel = `<select class="w-forme" id="${id('forme')}" data-side="${side}" data-f="forme">${formes.map(f => `<option ${f === p._sp ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>`;
  const g = p.gender;
  const genderSel = `<select class="w-gender" id="${id('gender')}" data-side="${side}" data-f="gender">${[['M','Male'],['F','Female'],['N','Genderless']].map(([v, t]) => `<option value="${v}" ${g === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  let rows = '';
  for (const st of ST) {
    const boost = st === 'hp' ? '<td></td>' : `<td><select id="${id('b-' + st)}" data-side="${side}" data-f="boost" data-k="${st}">${Array.from({length:13}, (_, i) => 6 - i).map(v => `<option value="${v}" ${v === (set.boosts[st] || 0) ? 'selected' : ''}>${v === 0 ? '--' : (v > 0 ? '+' + v : v)}</option>`).join('')}</select></td>`;
    let extra = '';
    if (st === 'spe') {
      const fs = speedOf(p, side), mods = [];
      if (p.boosts.spe) mods.push(`stage ${p.boosts.spe > 0 ? '+' : ''}${p.boosts.spe}`);
      if (p.hasItem('Choice Scarf')) mods.push('Choice Scarf ×1.5'); if (p.hasItem('Iron Ball')) mods.push('Iron Ball ×0.5');
      if (S.sides[side].tailwind) mods.push('Tailwind ×2');
      if (p.status === 'par') mods.push('Null paralysis ×0.25');
      extra = `<td class="num">${fs}<span class="spdicon" title="Final speed${mods.length ? ': ' + esc(mods.join(', ')) : ''}">☰</span></td>`;
    }
    rows += `<tr><th>${STAT_LABEL[st]}</th><td><input class="num" id="${id('base-' + st)}" type="number" min="1" max="255" value="${p.species.baseStats[st]}" data-side="${side}" data-f="base" data-k="${st}"></td>
      <td><input class="num" id="${id('iv-' + st)}" type="number" min="0" max="31" value="${set.ivs[st]}" data-side="${side}" data-f="iv" data-k="${st}"></td>
      <td class="v">${p.rawStats[st]}</td>${boost}${extra}</tr>`;
  }
  const max = p.maxHP(), cur = curHP(p), pct = max ? Math.round(cur / max * 1000) / 10 : 0;
  const natOpts = NATURES.map(n => { const d = GEN.natures.get(toID(n)); const pl = d && d.plus && d.plus !== d.minus ? ` (+${STAT_LABEL[d.plus].replace('Attack','Atk').replace('Defense','Def').replace('Speed','Spe')}, -${STAT_LABEL[d.minus].replace('Attack','Atk').replace('Defense','Def').replace('Speed','Spe')})` : ''; return `<option value="${n}" ${n === set.nature ? 'selected' : ''}>${n}${pl}</option>`; }).join('');
  let moves = '';
  set.moves.forEach((mn, i) => {
    const base = mn ? nullMoveBase(mn, set) : null;
    const mo = set.mo[i] || {};
    const bp = mo.bp != null && mo.bp !== '' ? mo.bp : (base ? base.bp : '');
    const type = mo.type || (base ? base.type : '');
    const cat = mo.cat || (base ? base.category : '');
    moves += `<div class="mvrow">
      <input class="mv" id="${id('mv' + i)}" list="dl-moves" value="${esc(mn)}" data-side="${side}" data-f="move" data-k="${i}" placeholder="(No Move)" autocomplete="off" aria-label="Move ${i + 1}">
      <input class="bp num" id="${id('bp' + i)}" type="number" min="0" value="${bp}" data-side="${side}" data-f="mbp" data-k="${i}" aria-label="Base power">
      <select id="${id('mt' + i)}" data-side="${side}" data-f="mtype" data-k="${i}" aria-label="Move type">${TYPES.map(t => `<option ${t === type ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="${id('mc' + i)}" data-side="${side}" data-f="mcat" data-k="${i}" aria-label="Category">${['Physical','Special','Status'].map(t => `<option ${t === cat ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="${mo.crit ? 'on' : ''}" data-act="crit" data-side="${side}" data-k="${i}" aria-pressed="${!!mo.crit}">Crit</button>
      <button disabled title="Z-Moves are not in Pokémon Null">Z</button>
    </div>${mn && !base ? '<div class="mvchg err">Unknown move</div>' : ''}${base && base.changed ? `<div class="mvchg">Null change: ${esc(Object.entries(MOVE_CHANGES[base.display] || MOVE_CHANGES[base.name]).map(([k, v]) => `${k === 'bp' ? 'BP' : k === 'acc' ? 'Acc' : k === 'pp' ? 'PP' : 'Type'} ${v == null ? '–' : v}`).join(', '))}</div>` : ''}`;
  });
  const megaNote = '';
  const sp = spriteFor(set);
  return `<fieldset><legend>${title}${sprImg(sp, 'lg')}</legend>${tabs}${picker}
    <div class="${hid.Type ? 'hidden-sec' : ''} typesec">${sprImg(sp, 'big')}
      <div class="prow"><span>Type</span><span class="ctl">${typeSel(0)}${typeSel(1)}${megaNote}</span></div>
      <div class="prow"><span>Forme</span><span class="ctl">${formeSel}</span></div>
      <div class="prow"><span>Gender</span><span class="ctl">${genderSel}</span></div>
      <div class="prow"><span>Level</span><span class="ctl"><input class="w-lv num" id="${id('level')}" type="number" min="1" max="100" value="${set.level}" data-side="${side}" data-f="level"></span></div>
    </div>
    <div class="${hid.Stats ? 'hidden-sec' : ''}">
      <table class="stats"><thead><tr><th></th><th>Base</th><th>IVs</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="prow"><span>Nature</span><span class="ctl"><select class="w-wide" id="${id('nature')}" data-side="${side}" data-f="nature">${natOpts}</select></span></div>
    <div class="prow"><span>Ability</span><span class="ctl"><input class="w-wide" id="${id('ability')}" list="dl-abilities" value="${esc(set.ability)}" data-side="${side}" data-f="ability" autocomplete="off"></span></div>
    <div class="prow"><span>Item</span><span class="ctl"><input class="w-wide" id="${id('item')}" list="dl-items" value="${esc(set.item)}" data-side="${side}" data-f="item" autocomplete="off"></span></div>
    <div class="prow"><span>Status</span><span class="ctl"><select class="w-wide" id="${id('status')}" data-side="${side}" data-f="status">${STATUS_OPTS.map(([v, t]) => `<option value="${v}" ${v === set.status ? 'selected' : ''}>${t}</option>`).join('')}</select></span></div>
    <button class="saltbtn ${S.sides[side].saltCured ? 'on' : ''}" data-act="salt" data-side="${side}" aria-pressed="${S.sides[side].saltCured}">Salt Cure</button>
    <div class="${hid.HP ? 'hidden-sec' : ''}">
      <div class="hpline">Current HP <input class="num" id="${id('hp')}" type="number" min="0" max="${max}" value="${cur}" data-side="${side}" data-f="hp">/${max} ( <input class="num" id="${id('hppct')}" type="number" min="0" max="100" step="0.1" value="${pct}" data-side="${side}" data-f="hppct">%)</div>
      <div class="healthlbl">Health</div>
      <div class="hbar"><i style="width:${pct}%;background:${pct > 50 ? 'var(--hp)' : pct > 20 ? 'var(--warn)' : 'var(--bad)'}"></i></div>
    </div>
    <div class="${hid.Moves ? 'hidden-sec' : ''}">${moves}</div>
  </fieldset>`;
}

/* ---------- Field panel ---------- */

  const f = S.field;
  const fb = (key, val, label) => `<button class="${f[key] === val ? 'on' : ''}" data-act="fld" data-k="${key}" data-v="${val}">${label}</button>`;
  const tb = (key, label, dis) => `<button class="${f[key] ? 'on' : ''}" data-act="ftog" data-k="${key}" ${dis ? 'disabled title="' + dis + '"' : ''}>${label}</button>`;
  const sb = (side, key, label) => `<button class="${S.sides[side][key] ? 'on' : ''}" data-act="stog" data-side="${side}" data-k="${key}">${label}</button>`;
  const spikes = side => {
    const n = S.sides[side].spikes;
    const b = v => `<button class="${n === v ? 'on' : ''}" data-act="spk" data-side="${side}" data-v="${v}">${v}</button>`;
    return side === 'player' ? `<span class="spk">${b(0)}${b(1)}${b(2)}<button class="${n === 3 ? 'on' : ''}" data-act="spk" data-side="${side}" data-v="3">3 Spikes</button></span>`
      : `<span class="spk"><button class="${n === 3 ? 'on' : ''}" data-act="spk" data-side="${side}" data-v="3">3 Spikes</button>${b(2)}${b(1)}${b(0)}</span>`;
  };
  const pair = side => [['reflect','Reflect'],['lightScreen','Light Screen']].map(([k, l]) => sb(side, k, l));
  const col = side => {
    const scr = pair(side); if (side === 'ai') scr.reverse();
    return `<div class="col ${side === 'player' ? 'l' : 'r'}">${sb(side, 'sr', 'Stealth Rock')}${spikes(side)}<span class="spk">${scr.join('')}</span>
      ${[['protect','Protect'],['seeded','Leech Seed'],['foresight','Foresight'],['helpingHand','Helping Hand'],['tailwind','Tailwind'],['flowerGift','Flower Gift'],['powerTrick','Power Trick'],['friendGuard','Friend Guard'],['auroraVeil','Aurora Veil'],['battery','Battery'],['powerSpot','Power Spot'],['switching','Switching Out']].map(([k, l]) => sb(side, k, l)).join('')}
      <button class="exp" data-act="export" data-side="${side}">Export</button></div>`;
  };
  return `<fieldset><legend>Field</legend>
    <div class="fgroup"><span class="seg">${fb('gameType','Singles','Singles')}${fb('gameType','Doubles','Doubles')}</span></div>
    <div class="fgroup"><span class="seg">${fb('terrain','Electric','Electric Terrain')}${fb('terrain','Grassy','Grassy Terrain')}${fb('terrain','Misty','Misty Terrain')}</span><span class="seg">${fb('terrain','Psychic','Psychic Terrain')}</span></div>
    <hr class="fsep">
    <div class="fgroup"><span class="seg">${fb('weather','','None')}${fb('weather','Sun','Sun')}${fb('weather','Rain','Rain')}${fb('weather','Sand','Sand')}${fb('weather','Snow','Snow')}</span><span class="seg">${fb('weather','Hail','Hail')}</span></div>
    <div class="fgroup"><span class="seg">${fb('weather','Harsh Sunshine','Harsh Sunshine')}${fb('weather','Heavy Rain','Heavy Rain')}${fb('weather','Strong Winds','Strong Winds')}</span></div>
    <div class="fgroup"><span class="seg">${tb('magicRoom','Magic Room')}${tb('wonderRoom','Wonder Room')}</span></div>
    <div class="fgroup"><span class="seg">${tb('gravity','Gravity')}</span></div>
    <div class="fgroup"><span class="seg">${tb('inverse','Inverse Battle','The damage engine has no Inverse Battle mode')}</span></div>
    <hr class="fsep">
    <div class="sides">${col('player')}${col('ai')}</div>
  </fieldset>`;
}

/* ---------- top results ---------- */
function moveResults(side, r){
  const set = sideSet(side);
  const p = set && buildMon(set);
  const name = p ? p._sp : (set ? set.species : '');
  const list = r && r.ctx ? (side === 'player' ? r.ctx.plMoves : r.ctx.aiMoves) : [];
  const def = r && r.ctx ? (side === 'player' ? r.ctx.ai : r.ctx.pl) : null;
  let topP = -1; if (side === 'ai' && r && r.tally) r.tally.forEach(t => { if (t > topP) topP = t; });
  const rows = [0, 1, 2, 3].map(slot => {
    const m = list.find(x => x.slot === slot);
    const mn = set ? set.moves[slot] : '';
    if (!mn) return `<div class="mr-row"><button disabled>(No Move)</button><span class="mr-text"></span></div>`;
    const on = UI.sel.side === side && UI.sel.slot === slot ? 'on' : '';
    let text = '';
    if (!m) text = '<span class="err">?</span>';
    else if (m.status) text = '0 - 0%';
    else if (m.res) { try { text = esc(m.res.moveDesc()); } catch(e){ text = `${(m.min / def.maxHP() * 100).toFixed(1)} - ${(m.max / def.maxHP() * 100).toFixed(1)}%`; } }
    if (m && !m.status && def) { const hp = curHP(def); if (m.min >= hp) text = `<span class="ko1">${text}</span>`; else if (m.max >= hp) text = `<span class="ko2">${text}</span>`; }
    let ai = '';
    if (side === 'ai' && m && r.tally) { const i = r.ctx.aiMoves.indexOf(m); const pr = r.tally[i]; ai = `<span class="aip ${pr === topP && pr > 0 ? 'top' : ''}" title="AI가 이 기술을 고를 확률">AI ${(pr * 100).toFixed(1)}%</span>`; }
    return `<div class="mr-row"><button class="${on}" data-act="selmv" data-side="${side}" data-k="${slot}">${esc(m ? m.display : mn)}</button><span class="mr-text"><span>${text}</span>${ai}</span></div>`;
  }).join('');
  return `<div class="mr-head"><b>${esc(name)}'s Moves</b> (select one to show detailed results)</div>${rows}`;
}
function mainResult(r){
  if (!r) return '';
  if (r.error) return `<div class="main-line err">${esc(r.error)}</div>`;
  const list = UI.sel.side === 'player' ? r.ctx.plMoves : r.ctx.aiMoves;
  let m = list.find(x => x.slot === UI.sel.slot) || list.find(x => !x.status) || list[0];
  if (!m) return '<div class="main-line muted">Enter some moves.</div>';
  if (m.status) return `<div class="main-line">${esc(m.display)} is a status move.</div>`;
  let line = '';
  try { line = m.res.fullDesc(); } catch(e){ line = m.err || 'No damage.'; }
  const def = UI.sel.side === 'player' ? r.ctx.ai : r.ctx.pl;
  const att = UI.sel.side === 'player' ? r.ctx.pl : r.ctx.ai;
  // Null has no EVs: show IVs where the calc prints EVs, like the community calc
  const KEY = {HP:'hp', Atk:'atk', Def:'def', SpA:'spa', SpD:'spd', Spe:'spe'};
  const ivify = (txt, mon) => txt.replace(/\b0([+-]?) (HP|Atk|Def|SpA|SpD|Spe)\b/g, (_, s, st) => `${mon._set.ivs[KEY[st]]}${s} ${st}`);
  const vs = line.indexOf(' vs. ');
  if (vs > 0) line = ivify(line.slice(0, vs), att) + ' vs. ' + ivify(line.slice(vs + 5), def);
  const critRate = UI.sel.side === 'player' ? '1/16' : '1/8';
  return `<div class="main-line">${esc(line)}</div>
    <div class="amounts">Possible damage amounts: (${m.rolls.join(', ')})</div>
    ${m.crit ? `<div class="amounts crit">Critical hit (Null: ${UI.sel.side === 'player' ? 'player' : 'AI'} ${critRate} at stage 0): (${m.crit.join(', ')}) — ${(Math.min(...m.crit) / def.maxHP() * 100).toFixed(1)} - ${(Math.max(...m.crit) / def.maxHP() * 100).toFixed(1)}%</div>` : ''}`;
}

/* ---------- bottom panels ---------- */
function ccClass(set){
  if (!UI.cc) return '';
  const ai = buildMon(sideSet('ai')), me = buildMon(set);
  if (!ai || !me) return '';
  const meAtt = buildMon(set, {attacking:true}) || me;
  const mine = set.moves.map((n, i) => n ? evalMove(meAtt, ai, n, fieldFor('player'), 'player', set.mo[i], i) : null).filter(m => m && !m.invalid && !m.status);
  const aiAtt = buildMon(ai._set, {attacking:true}) || ai;
  const theirs = ai._set.moves.map((n, i) => n ? evalMove(aiAtt, me, n, fieldFor('ai'), 'ai', ai._set.mo[i], i) : null).filter(m => m && !m.invalid && !m.status);
  const aiFast = aiIsFaster(speedOf(ai, 'ai'), speedOf(me, 'player'));
  const sure = mine.some(m => m.min >= curHP(ai)), maybe = mine.some(m => m.max >= curHP(ai));
  const dies = theirs.some(m => m.max >= curHP(me));
  if (aiFast && dies) return 'cc-r';
  if (!aiFast && sure) return 'cc-g';
  if (maybe) return 'cc-y';
  return '';
}

function aiPanel(r){
  let body = '';
  if (!r) body = '<p class="muted">양쪽 포켓몬을 정해주세요.</p>';
  else if (r.error) body = `<p class="err">${esc(r.error)}</p>`;
  else {
    const ctx = r.ctx;
    const rows = ctx.aiMoves.map((m, i) => ({m, p:r.tally[i], i})).sort((a, b) => b.p - a.p);
    const dist = h => [...h.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([s, c]) => `${s > 0 ? '+' + s : s}: ${(c / r.N * 100).toFixed(0)}%`).join(' · ');
    body = `<div class="ai-sum"><span class="tag ${ctx.aiFaster ? 'bad' : 'good'}">Spe AI ${ctx.aiSpe} / 나 ${ctx.plSpe} → ${ctx.aiFaster ? 'AI 선공' : '내 선공'}</span>
      ${ctx.aiMaxKill ? '<span class="tag bad">AI 최고 난수 킬 가능</span>' : ''}${ctx.support ? '<span class="tag warn">Support 분류</span>' : ''}</div>
      <div class="odds">${rows.map(({m, p, i}) => `<div class="odd"><span class="nm">${esc(m.display)}</span><span class="pc">${(p * 100).toFixed(1)}%</span><span class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></span><span class="ds">점수 ${dist(r.hist[i])}${r.killCount[i] ? ` · 킬 ${(r.killCount[i] / r.N * 100).toFixed(0)}%` : ''}</span></div>`).join('')}
      ${r.pSwitch > 0.0005 ? `<div class="odd sw"><span class="nm">교체 → ${esc([...r.swTo.entries()].sort((a, b) => b[1] - a[1]).map(([ci, c]) => `${r.cands[ci].set.species} ${(c / r.swValid * 100).toFixed(0)}%`).join(', '))}</span><span class="pc">${(r.pSwitch * 100).toFixed(1)}%</span><span class="bar"><i style="width:${(r.pSwitch * 100).toFixed(1)}%"></i></span><span class="ds">${esc(r.sw.reason)}</span></div>` : ''}</div>
      <p class="note">교체 판정: ${esc(r.sw.reason)}${r.sw.p > 0 && r.pSwitch === 0 ? ' (점수 0 이상인 교체 대상이 없어 교체 안 함)' : ''}</p>
      <div class="subh">쓰러뜨리면 다음에 나올 포켓몬</div>
      ${r.cands.length ? `<div class="odds">${r.cands.map((c, i) => ({c, p:(r.postKO.get(i) || 0) / r.iters, sc:r.postScores[i]})).sort((a, b) => b.p - a.p).map(({c, p, sc}) => `<div class="odd sw"><span class="nm">${sprImg(spriteFor(c.set), 'sm')}${esc(c.set.species)}</span><span class="pc">${(p * 100).toFixed(1)}%</span><span class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></span><span class="ds">점수 ${[...sc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([s, n]) => `${s > 0 ? '+' + s : s}: ${(n / r.iters * 100).toFixed(0)}%`).join(' · ')} · Spe ${c.spe}</span></div>`).join('')}</div>` : '<p class="muted">남은 포켓몬 없음</p>'}`;
  }
  const b = S.b;
  const cb = (k, label, obj) => { obj = obj || b; return `<label><input type="checkbox" id="st-${k}" data-act="btog" data-k="${k}" data-o="${obj === S.field ? 'f' : obj === S.sides.player ? 'sp' : 'b'}" ${obj[k] ? 'checked' : ''}> ${label}</label>`; };
  const aiMv = sideSet('ai') ? sideSet('ai').moves.filter(Boolean) : [];
  const plMv = sideSet('player') ? sideSet('player').moves.filter(Boolean) : [];
  const sel = (k, label, opts) => `<label>${label} <select id="st-${k}" data-act="bsel" data-k="${k}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(b[k]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
  return `<fieldset><legend>AI 행동 예측</legend>${body}
    <details class="st" ${UI.stOpen ? 'open' : ''} id="st-box"><summary>AI 판단용 턴 상황</summary><div class="togs">
      ${cb('aiFirstTurn', 'AI가 방금 나옴 (첫 턴)')}
      <label>AI 필드 체류 턴 <input class="num" type="number" min="1" max="99" id="st-aiTurns" data-act="bnum" data-k="aiTurns" value="${b.aiTurns}" style="width:44px"></label>
      ${sel('aiLastMove', 'AI 직전 기술', [['', '없음'], ...aiMv.map(m => [m, m])])}
      ${sel('plLastMove', '내 직전 기술', [['', '없음'], ...plMv.map(m => [m, m])])}
      ${sel('protectCount', 'AI 연속 방어', [[0, '0회'], [1, '1회'], [2, '2회 이상']])}
      ${sel('speedOverride', '선공 판정', [['auto', '자동'], ['ai', 'AI가 빠름'], ['pl', '내가 빠름']])}
      ${cb('trickRoom', '트릭룸', S.field)}
      ${cb('tspikes', '내 쪽 독압정', S.sides.player)} ${cb('web', '내 쪽 끈적끈적네트', S.sides.player)}
      ${cb('plLastMon', '내 마지막 포켓몬')} ${cb('plRecharging', '내가 반동으로 못 움직임')}
      ${cb('plConfused', '나: 혼란')} ${cb('plInfatuated', '나: 헤롱헤롱')} ${cb('plTrapped', '나: 갇힘')} ${cb('plWrapped', '나: 조이기류')}
      ${cb('plPerish', '나: 멸망의노래')} ${cb('plCursed', '나: 저주')} ${cb('plYawn', '나: 하품')} ${cb('plTaunted', '나: 도발')}
      ${cb('plSub', '나: 대타출동')} ${cb('futureSightOnPl', '미래예지 대기 중')}
      ${cb('aiTaunted', 'AI: 도발 당함')} ${cb('aiSub', 'AI: 대타출동')} ${cb('aiWrapped', 'AI: 조이기류')} ${cb('aiCursed', 'AI: 저주')}
      ${cb('aiYawn', 'AI: 하품')} ${cb('aiPerishFaint', 'AI: 멸망의노래로 이번 턴 기절')} ${cb('aiDisguise', 'AI: 탈 유지')} ${cb('aiDefCurled', 'AI: 웅크리기 사용')}
      ${cb('aiBerryEaten', 'AI: 나무열매 먹음')} ${cb('aiAboutToFaint', 'AI: 턴 끝에 쓰러짐')} ${cb('aiUnburden', 'AI: 곡예 발동')} ${cb('plUnburden', '나: 곡예 발동')}
      <label>시뮬레이션 <select id="st-sims" data-act="sims">${[1000, 4000, 10000].map(v => `<option ${v === S.sims ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    </div></details>
    <p class="note">Null AI 문서 기준. AI는 기술마다 난수 하나를 굴리고(연속기 3타), 최고 데미지 기술 +6/+8, 느린 킬 +9/+11, 빠른 킬 +12/+14, 변화기 기본 +6입니다. 동점은 무작위. 싱글 배틀 규칙만 반영했습니다.</p>
  </fieldset>`;
}

/* ---------- render ---------- */
let LAST = null;
function renderAll(){
  const ae = document.activeElement, aid = ae && ae.id;
  let sel0 = null, sel1 = null; try { sel0 = ae.selectionStart; sel1 = ae.selectionEnd; } catch(e){}
  const stBox = document.getElementById('st-box'); if (stBox) UI.stOpen = stBox.open;
  const r = simulate(); LAST = r;
  document.getElementById('dl-plsets').innerHTML = plSetList();
  document.getElementById('mr-1').innerHTML = moveResults('player', r);
  document.getElementById('mr-2').innerHTML = moveResults('ai', r);
  document.getElementById('main').innerHTML = mainResult(r);
  document.getElementById('p1').innerHTML = pokePanel('player');
  document.getElementById('fieldp').innerHTML = fieldPanel();
  document.getElementById('p2').innerHTML = pokePanel('ai');
  document.getElementById('teambox').innerHTML = teamBox();
  document.getElementById('opp').innerHTML = oppTeam();
  document.getElementById('aip').innerHTML = aiPanel(r);
  if (aid) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus({preventScroll:true}); try { if (sel0 != null) el.setSelectionRange(sel0, sel1); } catch(e){} } }
}
function shell(){
  app.innerHTML = `${staticLists()}
    <div class="results-top"><div id="mr-1"></div><div id="mr-2"></div></div>
    <div class="main-result" id="main"></div>
    <div class="tri"><div id="p1"></div><div id="fieldp"></div><div id="p2"></div></div>
    <div class="tri bottom"><div id="teambox"></div>${middleBottom()}<div class="stack"><div id="opp"></div><div id="aip"></div></div></div>`;
}
let timer = null;
const later = (ms) => { clearTimeout(timer); timer = setTimeout(() => { renderAll(); save(); }, ms == null ? 200 : ms); };
const now = () => { clearTimeout(timer); renderAll(); save(); };

/* ---------- persistence ---------- */
const LS = 'null-calc-v2';
function save(){
  try { localStorage.setItem(LS, JSON.stringify({box:S.player.box.filter(s => !s.example), active:S.player.active, trainer:S.ai.trainer, notes:UI.notes, cc:UI.cc})); } catch(e){}
}
function load(){ try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){ return null; } }

function loadTrainer(i, monIdx){
  S.ai.trainer = (i + TRAINERS.length) % TRAINERS.length; S.ai.active = monIdx || 0;
  S.ai.team = TRAINERS[S.ai.trainer].mons.map(trainerMonToSet);
  resetAiTurn();
}
function resetAiTurn(){ S.b.aiLastMove = ''; S.b.aiFirstTurn = true; S.b.aiTurns = 1; S.b.protectCount = 0; }
function exportSet(set){
  if (!set) return '';
  const lines = [`${set.species}${set.item ? ' @ ' + set.item : ''}`];
  if (set.ability) lines.push('Ability: ' + set.ability);
  lines.push('Level: ' + set.level);
  lines.push(set.nature + ' Nature');
  lines.push('IVs: ' + ST.map(s => `${set.ivs[s]} ${{hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'}[s]}`).join(' / '));
  set.moves.filter(Boolean).forEach(m => lines.push('- ' + m));
  return lines.join('\n');
}

/* ---------- events ---------- */
function onField(el, ev){
  const side = el.dataset.side, f = el.dataset.f, k = el.dataset.k;
  const set = sideSet(side); if (!set) return;
  const p0 = buildMon(set);
  if (f === 'pick') {
    if (ev !== 'change') return;
    const v = el.value.trim();
    const bare = v.replace(/\s*\(.*\)\s*$/, '');
    if (side === 'ai') {
      const lv = v.toLowerCase();
      const hit = AI_SET_BY_LABEL.get(v) || (v.includes('(') ? (AI_SETS.find(l => l.toLowerCase() === lv) && AI_SET_BY_LABEL.get(AI_SETS.find(l => l.toLowerCase() === lv))) : null);
      if (hit) { loadTrainer(hit[0], hit[1]); UI.sel = {side:'player', slot:0}; }
      else if (resolveSpecies(bare)) { Object.assign(set, makeSet({species:resolveSpecies(bare), level:set.level})); const d = GEN.species.get(toID(resolveSpecies(bare))); set.ability = d.abilities ? d.abilities[0] : ''; }
    } else {
      const idx = S.player.box.findIndex((s, i) => plLabel(s, i) === v);
      if (idx >= 0) S.player.active = idx;
      else if (resolveSpecies(bare)) {
        const v = bare;
        const d = GEN.species.get(toID(resolveSpecies(v)));
        S.player.box.push(makeSet({species:resolveSpecies(v), level:set.level, ability:d.abilities ? d.abilities[0] : '', loc:'box'}));
        S.player.active = S.player.box.length - 1;
      }
    }
    return now();
  }
  if (['ability','item','move'].includes(f) && ev !== 'change') return;
  if (f === 'type') { const t = set.types ? set.types.slice() : (p0 ? p0.types.slice() : ['Normal']); t[+k] = el.value; set.types = [t[0], t[1] || ''].filter((x, i) => i === 0 || x); }
  else if (f === 'forme') { set.species = el.value; set.types = null; set.baseOv = {}; set.curHP = null; }
  else if (f === 'gender') set.gender = el.value;
  else if (f === 'level') { set.level = Math.max(1, Math.min(100, +el.value || 1)); set.curHP = null; }
  else if (f === 'base') { set.baseOv[k] = Math.max(1, +el.value || 1); if (k === 'hp') set.curHP = null; }
  else if (f === 'iv') { set.ivs[k] = Math.max(0, Math.min(31, +el.value || 0)); if (k === 'hp') set.curHP = null; }
  else if (f === 'boost') set.boosts[k] = +el.value;
  else if (f === 'nature') set.nature = el.value;
  else if (f === 'ability') set.ability = el.value;
  else if (f === 'item') set.item = el.value;
  else if (f === 'status') set.status = el.value;
  else if (f === 'hp') set.curHP = el.value === '' ? null : Math.max(0, +el.value);
  else if (f === 'hppct') { if (p0) set.curHP = Math.round(p0.maxHP() * Math.max(0, Math.min(100, +el.value)) / 100); }
  else if (f === 'move') { set.moves[+k] = el.value; set.mo[+k] = {}; }
  else if (f === 'mbp') set.mo[+k].bp = el.value === '' ? null : +el.value;
  else if (f === 'mtype') set.mo[+k].type = el.value;
  else if (f === 'mcat') set.mo[+k].cat = el.value;
  if (ev === 'input') later(); else now();
}
app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'notes') { UI.notes = el.value; save(); return; }
  if (el.dataset.side && el.dataset.f && el.type === 'number') onField(el, 'input');
  if (el.dataset.act === 'bnum') { S.b[el.dataset.k] = Math.max(1, +el.value || 1); later(); }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.side && el.dataset.f) return onField(el, 'change');
  const a = el.dataset.act;
  if (a === 'btog') { const o = el.dataset.o === 'f' ? S.field : el.dataset.o === 'sp' ? S.sides.player : S.b; o[el.dataset.k] = el.checked; return now(); }
  if (a === 'bsel') { const k = el.dataset.k; S.b[k] = k === 'protectCount' ? +el.value : el.value; return now(); }
  if (a === 'sims') { S.sims = +el.value; return now(); }
});
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, side = t.dataset.side, k = t.dataset.k, i = +t.dataset.i;
  if (['btog','bsel','bnum','sims'].includes(a)) return;
  if (a !== 'wipe') UI.wipeArmed = false;
  switch (a) {
    case 'selmv': UI.sel = {side, slot:+k}; return now();
    case 'tab': UI.hide[side][k] = !UI.hide[side][k]; return now();
    case 'crit': sideSet(side).mo[+k].crit = !sideSet(side).mo[+k].crit; return now();
    case 'salt': S.sides[side].saltCured = !S.sides[side].saltCured; return now();
    case 'fld': { const v = t.dataset.v; if (k === 'gameType') S.field.gameType = v; else S.field[k] = (S.field[k] === v && k === 'terrain') ? '' : v; return now(); }
    case 'ftog': S.field[k] = !S.field[k]; return now();
    case 'stog': S.sides[side][k] = !S.sides[side][k]; return now();
    case 'spk': S.sides[side].spikes = +t.dataset.v; return now();
    case 'export': { const ta = document.getElementById('io-text'); ta.value = exportSet(sideSet(side)); document.getElementById('io-msg').textContent = (side === 'player' ? 'Pokémon 1' : 'Pokémon 2') + ' exported.'; return; }
    case 'import': {
      const sets = parseShowdown(document.getElementById('io-text').value);
      const msg = document.getElementById('io-msg');
      if (!sets.length) { msg.textContent = 'No sets found. Use “Name @ Item”, “Ability:”, “- Move” lines.'; return; }
      S.player.box = S.player.box.filter(s => !s.example).concat(sets.map(s => makeSet(Object.assign(s, {loc:'box'}))));
      S.player.active = S.player.box.length - sets.length;
      now(); document.getElementById('io-msg').textContent = `Imported ${sets.length} Pokémon.`; return;
    }
    case 'plpick': S.player.active = i; S.b.plLastMove = ''; UI.sel = {side:'player', slot:0}; return now();
    case 'aipick': if (e.target.closest('.x')) return; S.ai.active = i; resetAiTurn(); return now();
    case 'faint': e.stopPropagation(); S.ai.team[i].fainted = !S.ai.team[i].fainted; return now();
    case 'prevtr': loadTrainer(S.ai.trainer - 1); return now();
    case 'nexttr': loadTrainer(S.ai.trainer + 1); return now();
    case 'resettr': loadTrainer(S.ai.trainer); return now();
    case 'cc': UI.cc = !UI.cc; return now();
    case 'emptytrash': removeSets(s => s.loc === 'trash'); return now();
    case 'wipe': if (!UI.wipeArmed) { UI.wipeArmed = true; return now(); } UI.wipeArmed = false; removeSets(() => true); return now();
  }
});
function removeSets(pred){
  const cur = S.player.box[S.player.active];
  S.player.box = S.player.box.filter(s => !pred(s));
  if (!S.player.box.length) S.player.box = [exampleSet()];
  const ni = S.player.box.indexOf(cur); S.player.active = ni >= 0 ? ni : 0;
}
app.addEventListener('load', e => {
  const img = e.target; if (!img || img.tagName !== 'IMG') return;
  SPR_OK.add(img.getAttribute('src')); const c = img.closest('.chip'); if (c) c.classList.add('has-spr');
}, true);
app.addEventListener('error', e => {
  const img = e.target; if (!img || img.tagName !== 'IMG') return;
  SPR_BAD.add(img.getAttribute('src')); img.remove();
}, true);
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.chip')) { e.preventDefault(); e.target.click(); } });
app.addEventListener('dragstart', e => { const c = e.target.closest('.chip[data-act="plpick"]'); if (!c) return; UI.dragI = +c.dataset.i; try { e.dataTransfer.setData('text/plain', c.dataset.i); } catch(err){} });
app.addEventListener('dragover', e => { const z = e.target.closest('.zone[data-loc]'); if (z && UI.dragI != null) { e.preventDefault(); z.classList.add('drag'); } });
app.addEventListener('dragleave', e => { const z = e.target.closest('.zone[data-loc]'); if (z) z.classList.remove('drag'); });
app.addEventListener('drop', e => {
  const z = e.target.closest('.zone[data-loc]'); if (!z || UI.dragI == null) return;
  e.preventDefault(); const s = S.player.box[UI.dragI];
  if (s) { if (z.dataset.loc === 'team' && S.player.box.filter(x => x.loc === 'team').length >= 6 && s.loc !== 'team') {} else s.loc = z.dataset.loc; }
  UI.dragI = null; now();
});

/* ---------- boot ---------- */
function exampleSet(){ return makeSet({species:'Swampert', level:38, nature:'Adamant', ability:'Torrent', item:'Leftovers', moves:['Waterfall','Earthquake','Ice Punch','Stealth Rock'], example:true, loc:'team'}); }
const saved = load();
if (saved && saved.box && saved.box.length) { S.player.box = saved.box.map(s => makeSet(s)); S.player.active = Math.min(saved.active || 0, S.player.box.length - 1); }
else S.player.box = [exampleSet()];
if (saved) { UI.notes = saved.notes || ''; UI.cc = !!saved.cc; }
const startTrainer = saved && saved.trainer != null && TRAINERS[saved.trainer] ? saved.trainer : Math.max(0, TRAINERS.findIndex(t => t.name === 'Leader Roxanne'));
loadTrainer(startTrainer);
shell();
renderAll();
window.__nullcalc = {spriteURL, SPRITE_IDX, S, simulate, buildMon, resolveSpecies, resolveMove, TRAINERS, GEN, UI};

})();
</script>
